<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio Manager</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1><i class="fas fa-cog"></i> Portfolio Admin Panel</h1>
            <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        </header>

        <div class="admin-content">
            <!-- Add Project Form -->
            <div class="admin-card">
                <h2><i class="fas fa-plus-circle"></i> Add New Project</h2>
                <form id="addProjectForm">
                    <div class="form-group">
                        <label for="projectTitle">Project Title *</label>
                        <input type="text" id="projectTitle" required placeholder="e.g., E-commerce Mobile App">
                    </div>

                    <div class="form-group">
                        <label for="projectDescription">Description *</label>
                        <textarea id="projectDescription" required rows="4" placeholder="Brief description of your project"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="projectImage">Image URL</label>
                        <input type="url" id="projectImage" placeholder="https://example.com/image.jpg">
                        <small>Paste image URL or leave empty for placeholder</small>
                    </div>

                    <div class="form-group">
                        <label for="projectLink">Project Link (Optional)</label>
                        <input type="url" id="projectLink" placeholder="https://example.com">
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Add Project
                    </button>
                </form>
            </div>

            <!-- Projects List -->
            <div class="admin-card">
                <h2><i class="fas fa-list"></i> Manage Projects</h2>
                <div id="projectsList" class="projects-list">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Configuration -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase configuration - GANTI INI NANTI dengan config kamu
        const firebaseConfig = {
             apiKey: "AIzaSyBXDmYyQjYI7RpSw9r5J1GYgZDiPhd-26E",
             authDomain: "portfolio-riskydimasn.firebaseapp.com",
             databaseURL: "https://portfolio-riskydimasn-default-rtdb.asia-southeast1.firebasedatabase.app",
             projectId: "portfolio-riskydimasn",
             storageBucket: "portfolio-riskydimasn.firebasestorage.app",
             messagingSenderId: "1074691515560",
             appId: "1:1074691515560:web:691ecd5e1c76bc19c9ce9d",
             measurementId: "G-3DJXR6SWN6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const projectsRef = ref(database, 'projects');

        // Add Project
        document.getElementById('addProjectForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const projectData = {
                title: document.getElementById('projectTitle').value,
                description: document.getElementById('projectDescription').value,
                image: document.getElementById('projectImage').value || 'https://via.placeholder.com/400x300?text=Project+Image',
                link: document.getElementById('projectLink').value,
                createdAt: Date.now()
            };

            push(projectsRef, projectData)
                .then(() => {
                    showNotification('Project added successfully!', 'success');
                    document.getElementById('addProjectForm').reset();
                })
                .catch((error) => {
                    showNotification('Error: ' + error.message, 'error');
                });
        });

        // Load and Display Projects
        onValue(projectsRef, (snapshot) => {
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = '';

            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([id, project]) => {
                    const projectItem = document.createElement('div');
                    projectItem.className = 'project-item';
                    projectItem.innerHTML = `
                        <div class="project-info">
                            <img src="${project.image}" alt="${project.title}">
                            <div>
                                <h3>${project.title}</h3>
                                <p>${project.description}</p>
                                ${project.link ? `<a href="${project.link}" target="_blank">View Project</a>` : ''}
                            </div>
                        </div>
                        <div class="project-actions">
                            <button class="btn-edit" onclick="editProject('${id}', ${JSON.stringify(project).replace(/'/g, "&#39;")})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn-delete" onclick="deleteProject('${id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    projectsList.appendChild(projectItem);
                });
            } else {
                projectsList.innerHTML = '<p class="no-data">No projects yet. Add your first project above!</p>';
            }
        });

        // Delete Project
        window.deleteProject = (id) => {
            if (confirm('Are you sure you want to delete this project?')) {
                remove(ref(database, 'projects/' + id))
                    .then(() => {
                        showNotification('Project deleted successfully!', 'success');
                    })
                    .catch((error) => {
                        showNotification('Error: ' + error.message, 'error');
                    });
            }
        };

        // Edit Project (Simple implementation)
        window.editProject = (id, project) => {
            document.getElementById('projectTitle').value = project.title;
            document.getElementById('projectDescription').value = project.description;
            document.getElementById('projectImage').value = project.image;
            document.getElementById('projectLink').value = project.link || '';

            // Change form to update mode
            const form = document.getElementById('addProjectForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-save"></i> Update Project';
            
            form.onsubmit = (e) => {
                e.preventDefault();
                
                const updatedData = {
                    title: document.getElementById('projectTitle').value,
                    description: document.getElementById('projectDescription').value,
                    image: document.getElementById('projectImage').value || project.image,
                    link: document.getElementById('projectLink').value,
                    updatedAt: Date.now()
                };

                update(ref(database, 'projects/' + id), updatedData)
                    .then(() => {
                        showNotification('Project updated successfully!', 'success');
                        form.reset();
                        submitBtn.innerHTML = '<i class="fas fa-save"></i> Add Project';
                        form.onsubmit = null;
                        location.reload();
                    })
                    .catch((error) => {
                        showNotification('Error: ' + error.message, 'error');
                    });
            };

            // Scroll to form
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Notification System
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease forwards';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
